[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdisc-pairing"
version = "0.2.0"
description = "Constitutive model discovery by pairing sparse regression algorithms with model selection criteria"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {file = "LICENSE"}
dependencies = [
    "numpy==1.25.2",
    "scipy==1.11.2",
    "scikit-learn==1.3.0",
    "joblib==1.3.2",
    "threadpoolctl==3.2.0",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "matplotlib==3.7.2",
]

[project.scripts]
mdisc = "mdisc.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["mdisc*", "Anisotropic*", "Isotropic*"]
namespaces = false
